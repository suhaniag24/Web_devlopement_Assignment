<!DOCTYPE html>

        <style>
            *{
                margin: 0px;
                padding: 0px;
            }
            #head{
                text-align: center;
                margin:10px;
            }
            .container{
                display: flex;
                background-color: white;
                height: 200px;
                width: 1000px;
            }
            .movie{
                display: inline-block;
                border: 1px solid red;
                margin-top:10px;
                margin-left: 50px;
                margin-right: 3opx;
                width: 400px;
                height: 190px;
            }
            .poster{
                width:150px ;
                height: 100%;
                align:left;
            }
            .detail{
                display: inline-block;
                vertical-align: top;
                padding: 10px;
                margin: 10px;
            }
            .title{
                margin: 10px;
                justify-content: center;
            }
            .release-date{
                margin: 10px;
                justify-content: center;
            }
            .btn{
                margin: 10px;
                justify-content: center;
                background-color: antiquewhite;
            }
        </style>
