<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
#main{
    display:grid;
    grid-template-columns: repeat(4,1fr);
    grid-template-rows:repeat(3,1fr) ;
    height:200px;
    width:400px;
    grid-template-areas: 
    "a b b c"
    "d d e f"
    "g h i i";
    gap:20px;
    margin:10px;
}
.box1{
    grid-area:a;
    background-color: palevioletred;
}
.box2{
    grid-area:b;
    background-color: palevioletred;
}
.box3{
    grid-area:c;
    background-color: palevioletred;
}
.box4{
    grid-area:d;
    background-color: palevioletred;
}
.box5{
    grid-area:e;
    background-color: palevioletred;
}
.box6{
    grid-area:f;
    background-color: palevioletred;
}
.box7{
    grid-area:g;
    background-color: palevioletred;
}
.box8{
    grid-area:h;
    background-color: palevioletred;
}
.box9{
    grid-area:i;
    background-color: palevioletred;
}
    </style>
</head>
<body>
    <div id="main">
     <div class="box1"></div>
     <div class="box2"></div>
     <div class="box3"></div>
     <div class="box4"></div>
     <div class="box5"></div>
     <div class="box6"></div>
     <div class="box7"></div>
     <div class="box8"></div>
     <div class="box9"></div>
    </div>

</body>
</html>
