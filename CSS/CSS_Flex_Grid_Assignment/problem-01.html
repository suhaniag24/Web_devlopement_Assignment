<!DOCTYPE html>
<html>
  <head>
    <title>flex</title>
    <style>
      #gla{
        background-color: #0b1e36;
        display:flex;
        padding:10px;
        justify-content:space-between;
        align-items:center;
      }
      .container{
        display:flex;
      }
      .photo{
        width:40px;
        height:50px;
        margin:10px;
      }
      .uni{
        color:white;
      }
      .unis{
        color:white;
      }
      .navi{
        display:flex;
        gap:20px;
      }
      .photos{
        display: flex;
        justify-content: space-around;
        gap:10px;
      }
    </style>
  </head>
  <body>
    <div id="gla">
      <div class="container">

      <div>
      <p class="uni"><b>GLA</b></p>
      <p class="unis">University</p>
      </div>
      </div>
      <nav class="navi">
        <a href="#home">Home</a>
        <a href="#gallery">Gallery</a>
        <a href="#about">About</a>
      </nav>
    </div>
